; Endurecimento e desempenho do PHP em produção (Manager).
expose_php = Off
display_errors = Off
display_startup_errors = Off
log_errors = On
error_log = /proc/self/fd/2
memory_limit = 256M
max_execution_time = 30
date.timezone = UTC

; O limite real do inventário é 4 MiB (LimitAgentPayload); estes valores só dão folga ao PHP.
post_max_size = 6M
upload_max_filesize = 6M

; Sessões ficam no Redis (SESSION_DRIVER=redis); estas opções valem para qualquer uso nativo.
session.cookie_httponly = 1
session.use_strict_mode = 1

; OPcache: o código da imagem é imutável, então não precisa revalidar arquivos.
opcache.enable = 1
opcache.memory_consumption = 128
opcache.interned_strings_buffer = 16
opcache.max_accelerated_files = 20000
opcache.validate_timestamps = 0
realpath_cache_size = 4096K
realpath_cache_ttl = 600
