[www]
; As variáveis do contêiner (compose) são a configuração: o PHP precisa enxergá-las.
clear_env = no

; ~100 endpoints enviando a cada 60 s = poucas requisições por segundo. Ajustar após medir (task 013).
pm = dynamic
pm.max_children = 16
pm.start_servers = 4
pm.min_spare_servers = 2
pm.max_spare_servers = 6
pm.max_requests = 500

request_terminate_timeout = 60s
catch_workers_output = yes
decorate_workers_output = no
