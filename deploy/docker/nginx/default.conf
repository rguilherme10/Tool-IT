# nginx do Manager (imagem sem privilégios: escuta 8080/8443; o compose publica 80/443).
# O Agent exige HTTPS com certificado confiável: o certificado vem da CA corporativa (volume ./certs).

server {
    listen 8080 default_server;
    server_name _;
    return 301 https://$host$request_uri;     # o Agent recusa HTTP; isto só ajuda quem digita o endereço no navegador
}

server {
    listen 8443 ssl default_server;
    http2 on;
    server_name _;

    ssl_certificate     /etc/nginx/certs/fullchain.pem;
    ssl_certificate_key /etc/nginx/certs/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    server_tokens off;
    add_header Strict-Transport-Security "max-age=31536000" always;

    root /var/www/html/public;
    index index.php;

    # Inventário completo tem limite de 4 MiB na aplicação (LimitAgentPayload); aqui só barramos o exagero antes do PHP.
    client_max_body_size 5m;
    client_body_timeout 30s;

    # Nada de dotfiles (.env, .git) nem de listagem.
    location ~ /\.(?!well-known) { deny all; }

    location / {
        try_files $uri /index.php?$query_string;
    }

    # Só o front controller executa PHP.
    location = /index.php {
        fastcgi_pass app:9000;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
        fastcgi_param DOCUMENT_ROOT   $realpath_root;

        # O app só confia nestes cabeçalhos (TRUSTED_PROXIES). Sobrescrevemos, nunca repassamos o que o cliente mandou:
        # senão qualquer um forjaria o IP usado em limites de taxa, bloqueio de login e auditoria.
        fastcgi_param HTTP_X_FORWARDED_FOR   $remote_addr;
        fastcgi_param HTTP_X_FORWARDED_PROTO https;
        fastcgi_param HTTP_X_FORWARDED_HOST  $host;
        fastcgi_param HTTP_X_FORWARDED_PORT  443;

        fastcgi_read_timeout 60s;
        fastcgi_buffers 16 16k;
        fastcgi_buffer_size 32k;
    }

    location ~ \.php$ { return 404; }

    location ~* \.(?:css|js|woff2?|svg|png|ico)$ {
        expires 7d;
        add_header Cache-Control "public";
        access_log off;
        try_files $uri =404;
    }
}

# Verificação de saúde do contêiner: só dentro do próprio contêiner (127.0.0.1), HTTP simples, passando por PHP-FPM + Laravel.
server {
    listen 127.0.0.1:8081;
    server_name _;
    root /var/www/html/public;
    access_log off;
    location = /up {
        fastcgi_pass app:9000;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $realpath_root/index.php;
        fastcgi_param DOCUMENT_ROOT   $realpath_root;
        fastcgi_param SCRIPT_NAME     /index.php;
        fastcgi_param REQUEST_URI     /up;
        fastcgi_param HTTP_X_FORWARDED_PROTO https;
    }
    location / { return 404; }
}
